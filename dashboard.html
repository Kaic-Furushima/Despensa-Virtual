<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Despensa Virtual - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">Minha Despensa</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <span class="nav-link text-white" id="userEmailDisplay"></span>
                    </li>
                    <li class="nav-item">
                        <button class="btn btn-outline-light ms-2" id="btnLogout">Sair</button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- Alertas de Vencimento -->
        <div id="alertsContainer" class="mb-4"></div>

        <div class="row">
            <!-- Adicionar Alimento -->
            <div class="col-md-4 mb-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-white">
                        <h5 class="mb-0">Adicionar Alimento</h5>
                    </div>
                    <div class="card-body">
                        <form id="addFoodForm">
                            <div class="mb-3">
                                <label for="foodName" class="form-label">Nome</label>
                                <input type="text" class="form-control" id="foodName" required>
                            </div>
                            <div class="mb-3">
                                <label for="foodQuantity" class="form-label">Quantidade</label>
                                <input type="number" class="form-control" id="foodQuantity" min="1" required>
                            </div>
                            <div class="mb-3">
                                <label for="foodExpiration" class="form-label">Data de Validade</label>
                                <input type="date" class="form-control" id="foodExpiration" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Adicionar</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Lista de Alimentos -->
            <div class="col-md-8 mb-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-white d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">Alimentos em Estoque</h5>
                        <button class="btn btn-sm btn-success" id="btnSuggestRecipes">Sugerir Receitas</button>
                    </div>
                    <div class="card-body">
                        <input type="search" class="form-control mb-3" id="searchFood" placeholder="Buscar alimento..." aria-label="Buscar alimento">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead>
                                    <tr>
                                        <th>Nome</th>
                                        <th>Quantidade</th>
                                        <th>Validade</th>
                                        <th>Situação</th>
                                        <th>Ações</th>
                                    </tr>
                                </thead>
                                <tbody id="foodList">
                                    <!-- Itens carregados via JS -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toasts -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>

    <!-- Modal Editar Alimento -->
    <div class="modal fade" id="editFoodModal" tabindex="-1" aria-labelledby="editFoodTitle" aria-hidden="true">
        <div class="modal-dialog">
            <form class="modal-content" id="editFoodForm">
                <div class="modal-header">
                    <h5 class="modal-title" id="editFoodTitle">Editar Alimento</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="editFoodName" class="form-label">Nome</label>
                        <input type="text" class="form-control" id="editFoodName" required>
                    </div>
                    <div class="mb-3">
                        <label for="editFoodQuantity" class="form-label">Quantidade</label>
                        <input type="number" class="form-control" id="editFoodQuantity" min="1" required>
                    </div>
                    <div class="mb-3">
                        <label for="editFoodExpiration" class="form-label">Data de Validade</label>
                        <input type="date" class="form-control" id="editFoodExpiration" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Receitas -->
    <div class="modal fade" id="recipesModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Sugestões de Receitas</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="recipesList" class="row">
                        <!-- Receitas renderizadas via JS -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
